---
# backup-supabase — Backup Supabase PostgreSQL database to Wasabi
#
# Purpose: Create a timestamped backup of Supabase's PostgreSQL database
#   running in container `supabase-db`. Upload to Wasabi (S3) via rclone.
#   Retain 7 days locally, 90 days on Wasabi. Verify backup integrity.
#
# Usage:
#   /entrypoint.sh supabase
#   ansible-playbook /runner/playbooks/backup-supabase.yml
#
# Secrets:
#   ⚠️ TODO Phase 3: Add DB password to pass at infrastructure/presswork-pod/supabase/postgres-password
#     (currently not in pass store — Phase 3 action item)
#   Rclone: 'wasabi' remote on fnet2
#   Config: pass services/wasabi/account/{access-key-id,secret-access-key}
#
# DB Details:
#   Container: supabase-db
#   Database: postgres
#   User: postgres
#   Host: localhost (via docker exec on Dokploy host)
#
# Tags: backup, supabase

- name: "Backup Supabase PostgreSQL database"
  hosts: localhost
  gather_facts: true
  tags: [backup, supabase]

  vars:
    # Service identity
    service_name: "supabase"
    db_container: "supabase-db"
    db_name: "postgres"
    db_user: "postgres"
    # ⚠️ TODO Phase 3: Add DB password to pass at infrastructure/presswork-pod/supabase/postgres-password
    #   Playbook will fail until this is done. Add to pass store first.
    db_password: "{{ lookup('community.general.passwordstore', 'infrastructure/presswork-pod/supabase/postgres-password', missing='warn') | default('') }}"

    # rclone configuration
    rclone_remote: "wasabi"
    rclone_bucket: "friasc-backups/supabase"
    rclone_config_dir: "/root/.config/rclone"

    # Retention policy
    backup_retention_local_days: 7
    backup_retention_remote_days: 90

    # Paths (container-local /tmp for dump file)
    local_dump_path: "/tmp/supabase-db-{{ backup_timestamp }}.sql.gz"

  tasks:
    - name: Generate backup timestamp
      ansible.builtin.set_fact:
        backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"

    - name: Create rclone config directory
      ansible.builtin.file:
        path: "{{ rclone_config_dir }}"
        state: directory
        mode: "0700"

    - name: Dump and compress Supabase PostgreSQL database
      community.docker.docker_container_exec:
        container: "{{ db_container }}"
        command: >-
          pg_dump -U {{ db_user }} -d {{ db_name }} --no-owner --no-acl | gzip
      environment:
        PGPASSWORD: "{{ db_password }}"
      register: _pg_dump_result
      changed_when: true

    - name: Save compressed dump to /tmp
      ansible.builtin.copy:
        content: "{{ _pg_dump_result.stdout }}"
        dest: "{{ local_dump_path }}"
        mode: "0600"

    - name: Upload to Wasabi
      ansible.builtin.include_role:
        name: friasc.fleet_control_backup.backup_wasabi
      vars:
        backup_wasabi_source_file: "{{ local_dump_path }}"
        backup_wasabi_rclone_bucket: "{{ rclone_bucket }}"
        backup_wasabi_rclone_remote: "{{ rclone_remote }}"
        backup_wasabi_retention_local_days: "{{ backup_retention_local_days }}"
        backup_wasabi_retention_remote_days: "{{ backup_retention_remote_days }}"
        backup_wasabi_healthchecks_slug: "backup-supabase"
        backup_wasabi_service_name: "{{ service_name }}"

    - name: Clean up /tmp dump file
      ansible.builtin.file:
        path: "{{ local_dump_path }}"
        state: absent
      changed_when: true

- name: "Verify Supabase backup integrity"
  hosts: localhost
  gather_facts: false
  tags: [verify, supabase]

  tasks:
    - name: Verify latest Supabase backup on Wasabi
      ansible.builtin.include_role:
        name: friasc.fleet_control_backup.verify_backup
      vars:
        verify_backup_service_name: "Supabase DB"
        verify_backup_pattern: "supabase-db-*.sql.gz"
        verify_backup_rclone_remote: "wasabi"
        verify_backup_rclone_bucket: "{{ rclone_bucket }}"
        verify_backup_max_age_hours: 24
        verify_backup_ac_id: "SUP-BAK-04a"
